workflows:
  apk:
    name: Build APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Build
        script: |
          unzip -q BUETPrep.zip
          cd BUETPrep
          curl -sLo g.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q g.zip
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon
    artifacts:
      - BUETPrep/app/build/outputs/apk/debug/*.apk
